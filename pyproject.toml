[project]
name = "sharepostbot"
version = "1.0.4"
description = "Telegram posting bot for a closed community: reposts from source chats into the main channel with a signature"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    "aiogram~=3.27",
    "aiohttp~=3.10",
    "SQLAlchemy~=2.0",
    "aiosqlite~=0.20",
    "greenlet~=3.0",
    "pydantic~=2.9",
    "pydantic-settings~=2.5",
    "structlog~=24.4",
    "python-dotenv~=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest~=8.3",
    "pytest-asyncio~=0.24",
    "pytest-cov~=5.0",
    "ruff~=0.6",
    "mypy~=1.11",
]

[project.scripts]
sharepostbot = "bot.__main__:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bot"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF", "ASYNC", "S", "T20"]
# RUF001/002/003: false positives on Cyrillic strings in user-facing text.
# ASYNC240: false positive on pathlib in asyncio code (only relevant for trio/anyio).
ignore = ["S101", "S104", "S311", "E501", "RUF001", "RUF002", "RUF003", "ASYNC240"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501"]

[tool.mypy]
python_version = "3.12"
strict = false
disallow_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
