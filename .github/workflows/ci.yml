name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check bot tests
      - run: ruff format --check bot tests
      - run: mypy bot
      - run: pytest --cov=bot --cov-report=term-missing

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t sharepostbot .
      - run: docker run -d --name bot-test -p 8081:8081 -e BOT_TOKEN=test -e BOT_NAME=test -e MAIN_CHANNEL_ID=-100 -e HTTP_API_PASSWORD=test -e HTTP_HOST=0.0.0.0 sharepostbot
      - run: sleep 5 && curl -sf http://127.0.0.1:8081/health
      - if: always()
        run: docker logs bot-test
